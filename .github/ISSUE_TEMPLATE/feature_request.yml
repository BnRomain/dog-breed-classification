name: Feature request
description: Suggest an improvement of the pipeline, a new experiment or better documentation.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - "Preprocessing (cropping, resizing, padding)"
        - "Features (PCA, HOG) and classical classifiers (kNN, SVM)"
        - "Transfer learning"
        - "Tests and CI"
        - "Documentation (README, report, slides, wiki)"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or could be improved, and in which situation?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you implement it? A new padding strategy, another feature extractor, another model, a new figure...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about and why you prefer this one.
